[project]
name = "elcards-backend"
version = "0.1.0"
description = "Add your description here"

authors = [
    { name = "nwakalordivine", email = "divinenwakalor31@gmail.com" }
]
requires-python = ">=3.12.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
elcards-backend = "elcards_backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "src.elcards_backend.app:app"
